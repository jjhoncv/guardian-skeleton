# Llama al workflow del Guardián (__GUARDIAN__). Para subir de versión, cambia el @vX.Y.Z (Dependabot lo propone).
name: CI
run-name: "${{ github.event_name == 'push' && '🧪 Pruebas · main (después del merge)' || format('🧪 Pruebas · PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title) }}"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: jjhoncv/guardian/.github/workflows/guardian-ci.yml@__GUARDIAN__
